# The owner answers a request by closing its issue: completed = yes, not planned = no. This workflow wakes the
# loop at once; the logic (what the answer means) is in the engine script. The watchdog sweeps requests whose
# event was lost (for instance closed while AUTOPILOT was off).
name: owner-request
run-name: "owner request #${{ github.event.issue.number }} closed"

on:
  issues:
    types: [closed]

concurrency:
  group: owner-request-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  handle:
    if: vars.AUTOPILOT == 'on' && contains(github.event.issue.labels.*.name, 'owner-request')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      VARS_AUTOPILOT: ${{ vars.AUTOPILOT }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - run: |
          pip install -q pyyaml
          python3 .github/loop/loop.py git-identity
          python3 .github/loop/loop.py request-closed "${{ github.event.issue.number }}"
