# One session of the loop. Single input: the issue number. Role, model and limits come from the issue's labels
# and policy/profiles.yml. Started only by the engine (`launch` in common.py), never by hand.
#
# Three jobs after `prep` (ADR-0006): `stage` (GitHub token) puts everything the agent needs in a bundle; `session`
# (`permissions: {}`, only the Claude token and the secrets the owner consented to) runs the agent on it and packs what it
# left; `epilogue` (GitHub token, a fresh runner) takes that in as data (links, redirected paths and oversized files are
# refused), reads the commits from a git bundle and does everything else itself. The executor baseline reaches the
# epilogue through its own artifact, which the session never sees.
# Two kinds: `agent` (a Claude session) and `script` (a deterministic role, no model, no credential).
name: session
run-name: "session #${{ inputs.issue }}${{ inputs.role && format(' · {0}', inputs.role) || '' }}"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number with a role:* label
        required: true
      role:
        description: Role (only for the run name)
        required: false

concurrency:
  group: session-${{ inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  prep:
    if: vars.AUTOPILOT == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      go: ${{ steps.guard.outputs.go }}
      kind: ${{ steps.resolve.outputs.kind }}
      role: ${{ steps.resolve.outputs.role }}
      model: ${{ steps.resolve.outputs.model }}
      effort: ${{ steps.resolve.outputs.effort }}
      start: ${{ steps.resolve.outputs.start }}
      tools: ${{ steps.resolve.outputs.tools }}
      max_turns: ${{ steps.resolve.outputs.max_turns }}
      agent_timeout: ${{ steps.resolve.outputs.agent_timeout }}
      job_timeout: ${{ steps.resolve.outputs.job_timeout }}
      consented: ${{ steps.resolve.outputs.consented }}
      secrets: ${{ steps.resolve.outputs.secrets }}
      iteration: ${{ steps.resolve.outputs.iteration }}
      profile_digest: ${{ steps.resolve.outputs.profile_digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      VARS_AUTOPILOT: ${{ vars.AUTOPILOT }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # AUTOPILOT is the first step: a session created just before the switch-off stops too
      - id: guard
        run: |
          if python3 .github/loop/loop.py guard; then echo go=true >> "$GITHUB_OUTPUT"; else echo go=false >> "$GITHUB_OUTPUT"; fi
      # a dead credential ends the job before the agent stands up
      - if: steps.guard.outputs.go == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 .github/loop/loop.py probe
      - id: resolve
        if: steps.guard.outputs.go == 'true'
        run: |
          pip install -q pyyaml
          python3 .github/loop/loop.py resolve "${{ inputs.issue }}"

  stage:
    needs: prep
    if: needs.prep.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      baseline: ${{ steps.ship.outputs.baseline }}
    env:
      ISSUE: ${{ inputs.issue }}
      ROLE: ${{ needs.prep.outputs.role }}
      KIND: ${{ needs.prep.outputs.kind }}
      MODEL: ${{ needs.prep.outputs.model }}
      EFFORT: ${{ needs.prep.outputs.effort }}
      TOOLS: ${{ needs.prep.outputs.tools }}
      MAX_TURNS: ${{ needs.prep.outputs.max_turns }}
      AGENT_TIMEOUT: ${{ needs.prep.outputs.agent_timeout }}
      ITERATION: ${{ needs.prep.outputs.iteration }}
      PROFILE_DIGEST: ${{ needs.prep.outputs.profile_digest }}
      WORK: ${{ github.workspace }}/work
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      VARS_AUTOPILOT: ${{ vars.AUTOPILOT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: loop
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prep.outputs.start }}
          path: work
          fetch-depth: 0
          persist-credentials: false
      - id: guard
        working-directory: loop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python3 .github/loop/loop.py guard; then echo go=true >> "$GITHUB_OUTPUT"; else echo go=false >> "$GITHUB_OUTPUT"; fi
      - name: Stage the session
        if: steps.guard.outputs.go == 'true'
        working-directory: loop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q pyyaml
          python3 .github/loop/loop.py git-identity
          python3 .github/loop/loop.py stage "$ISSUE" "$WORK" "$RUNNER_TEMP/trusted"
      # The executor baseline travels in an artifact of its own, pinned by its digest: the session never receives it.
      - id: ship
        if: steps.guard.outputs.go == 'true'
        run: |
          mkdir "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/ship"
          mv "$RUNNER_TEMP/trusted/executor-baseline.json" "$RUNNER_TEMP/baseline/"
          echo "baseline=$(sha256sum "$RUNNER_TEMP/baseline/executor-baseline.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          tar -czf "$RUNNER_TEMP/ship/trusted.tar.gz" -C "$RUNNER_TEMP" trusted
          tar -czf "$RUNNER_TEMP/ship/work.tar.gz" -C "$GITHUB_WORKSPACE" work
      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.go == 'true'
        with:
          name: staged
          path: ${{ runner.temp }}/ship
      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.go == 'true'
        with:
          name: baseline
          path: ${{ runner.temp }}/baseline

  session:
    needs: [prep, stage]
    if: needs.prep.outputs.go == 'true' && needs.stage.result == 'success'
    runs-on: ubuntu-latest
    # No GitHub permission at all: the agent's code never runs next to the GitHub token (ADR-0006).
    permissions: {}
    # job_timeout = agent + gate + 30 min < 360: the 6 h limit kills a job as FAILED and the epilogue must fit
    timeout-minutes: ${{ fromJSON(needs.prep.outputs.job_timeout) }}
    env:
      ISSUE: ${{ inputs.issue }}
      KIND: ${{ needs.prep.outputs.kind }}
      MODEL: ${{ needs.prep.outputs.model }}
      EFFORT: ${{ needs.prep.outputs.effort }}
      TOOLS: ${{ needs.prep.outputs.tools }}
      MAX_TURNS: ${{ needs.prep.outputs.max_turns }}
      AGENT_TIMEOUT: ${{ needs.prep.outputs.agent_timeout }}
      WORK: ${{ github.workspace }}/work
      LOOP_SANDBOX: "1"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: staged
          path: ${{ runner.temp }}/ship
      - run: |
          date +%s > "$RUNNER_TEMP/session-start"
          tar -xzf "$RUNNER_TEMP/ship/trusted.tar.gz" -C "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/ship/work.tar.gz" -C "$GITHUB_WORKSPACE"
      - name: Tools
        run: |
          npm install -g "@anthropic-ai/claude-code@$(cat "$RUNNER_TEMP/trusted/cli-version")"
          bash "$RUNNER_TEMP/trusted/sandbox.sh"
      - name: Prepare the machine
        working-directory: work
        run: bash "$RUNNER_TEMP/trusted/prepare.sh"
      - name: Session
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ needs.prep.outputs.kind == 'agent' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          # The pool: every secret the loop may ever hand to a session, one line each, gated on the name in the
          # owner's consent for this task (`resolve` outputs `|NAME|…`). The owner owns this file; `resolve` refuses
          # a consented name that has no line here (`secret-missing`).
          #   NAME: ${{ contains(needs.prep.outputs.secrets, '|NAME|') && secrets.NAME || '' }}
        run: bash "$RUNNER_TEMP/trusted/agent.sh"
      # Opt-in capture for the E2E test (repo variable E2E_CAPTURE=on, off by default): everything the session saw and
      # left, for later analysis. It holds the session's inputs, so a real loop leaves it off. Only `find` and `stat`
      # look at the agent's checkout: no git command, no hook of the agent's can run here. The epilogue stores it.
      - name: Capture the session (E2E_CAPTURE)
        if: always() && vars.E2E_CAPTURE == 'on'
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p capture
          find "$WORK" -path "$WORK/.git" -prune -o -path "$WORK/.session" -prune -o -printf '%y %s %TY-%Tm-%TdT%TTZ %p\n' > capture/work-tree.txt || true
          find "$WORK" -path "$WORK/.git" -prune -o -path "$WORK/.session" -prune -o -type f -newer session-start -printf '%s %p\n' > capture/work-new-files.txt || true
          { uname -a; lsb_release -d || true; nproc; free -m; df -h "$WORK"; claude --version || true; bwrap --version || true; } > capture/machine.txt 2>&1 || true
          env | grep -E '^(GITHUB_(RUN|JOB|WORKFLOW|EVENT|REF|SHA|ACTOR)|RUNNER_|ImageOS|ImageVersion)' | sort > capture/env.txt || true
          present=(); for f in trusted capture stream.ndjson agent-exit agent-start agent-end claude-stderr.txt claude-execution-output.json script-output.txt secret-missing; do [ -e "$f" ] && present+=("$f"); done
          tar -czf capture.tgz "${present[@]}" -C "$WORK" .session || true
      - uses: actions/upload-artifact@v4
        # The stream is a diagnostic copy. A full artifact quota must not turn a good session into `failure`;
        # the record then simply has no `stream`.
        continue-on-error: true
        if: always()
        with:
          name: stream-${{ needs.prep.outputs.iteration }}-${{ inputs.issue }}
          path: ${{ runner.temp }}/stream.ndjson
          if-no-files-found: ignore
      - name: Pack the results
        if: always()
        run: python3 "$RUNNER_TEMP/trusted/session_artifact.py" pack "$WORK" "$RUNNER_TEMP" "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore

  epilogue:
    needs: [prep, stage, session]
    if: always() && needs.prep.outputs.go == 'true' && needs.stage.result == 'success'
    runs-on: ubuntu-latest
    env:
      ISSUE: ${{ inputs.issue }}
      ROLE: ${{ needs.prep.outputs.role }}
      KIND: ${{ needs.prep.outputs.kind }}
      MODEL: ${{ needs.prep.outputs.model }}
      EFFORT: ${{ needs.prep.outputs.effort }}
      ITERATION: ${{ needs.prep.outputs.iteration }}
      PROFILE_DIGEST: ${{ needs.prep.outputs.profile_digest }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      VARS_AUTOPILOT: ${{ vars.AUTOPILOT }}
      LOOP_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: loop
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # a session that died leaves no results: the epilogue still closes it
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: results
          path: ${{ runner.temp }}/results
      - uses: actions/download-artifact@v4
        with:
          name: baseline
          path: ${{ runner.temp }}/baseline
      - name: Tools
        working-directory: loop
        run: bash .github/loop/sandbox.sh
      - name: Epilogue
        working-directory: loop
        env:
          GH_TOKEN: ${{ github.token }}
          # the engine's own probe confirms a usage limit a session reports
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          pip install -q pyyaml
          python3 .github/loop/loop.py git-identity
          python3 .github/loop/loop.py epilogue "$ISSUE" "$RUNNER_TEMP/results" "$RUNNER_TEMP/baseline" "${{ needs.stage.outputs.baseline }}"
      # a release asset, not an artifact: the artifact quota of an account can be used up, and then nothing is stored
      - name: Store the capture (E2E_CAPTURE)
        if: always() && vars.E2E_CAPTURE == 'on'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/results/capture.tgz" ] || exit 0
          name="capture-${{ needs.prep.outputs.iteration }}-$ISSUE"
          cp "$RUNNER_TEMP/results/capture.tgz" "$RUNNER_TEMP/$name.tgz"
          gh release create e2e-capture --title e2e-capture --notes "Session captures of the E2E test" --target "$DEFAULT_BRANCH" -R "$GITHUB_REPOSITORY" || true
          gh release upload e2e-capture "$RUNNER_TEMP/$name.tgz" --clobber -R "$GITHUB_REPOSITORY"
