# E2E only (lives on the test branch, never in the engine): after the one iteration, with AUTOPILOT off, stage the
# sessions the NEXT iteration would get (Policymaker, audit, a worker with every export) on the real runner, and keep
# their `.session/` as an artifact. Nothing is run: the issues it creates are closed unstarted.
name: e2e-probe

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      VARS_AUTOPILOT: ${{ vars.AUTOPILOT }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      WORKS: ${{ github.workspace }}/probe-works
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - run: |
          pip install -q pyyaml
          python3 .github/loop/loop.py git-identity
          python3 e2e/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: ${{ env.WORKS }}
          include-hidden-files: true
          if-no-files-found: warn
