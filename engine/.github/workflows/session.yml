# One session of the loop. Single input: the issue number. Role, model and limits come from the issue's labels
# and policy/profiles.yml. Started only by the engine (`launch` in common.py), never by hand.
#
# Four jobs (ADR-0006): "Prepare the session" (GitHub token) puts everything the agent needs in a bundle; "Prepare the
# session inputs (policy scripts)" (`permissions: {}`, no secret, no checkout) runs the loop's policy scripts on it and
# checks what they print; `session` (`permissions: {}`, only the Claude token and the secrets the owner consented to) runs
# the agent on the result and packs what it left; "Take in results" (GitHub token, a fresh runner) takes that in as data
# (links, redirected paths and oversized files are refused), reads the files the session left and does everything else
# itself. The executor baseline reaches the last job through its own artifact, which the session never sees.
# Every artifact a job relies on is pinned by a digest that came through the outputs of the job that made it: any job of a
# run can upload artifacts (ADR-0006). A job without the engine checks it in the shell, as `pinned` below does
# (`artifact_pin.py` explains the digest).
# Two kinds: `agent` (an LLM session) and `script` (a deterministic role, no model, no credential).
name: Session
run-name: "session #${{ inputs.issue }}${{ inputs.role && format(' · {0}', inputs.role) || '' }}"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number with a role:* label
        required: true
      role:
        description: Role (only for the run name)
        required: false

concurrency:
  group: session-${{ inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  prep:
    name: Prepare the session
    if: vars.AUTOPILOT == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      go: ${{ steps.autopilot.outputs.go }}
      kind: ${{ steps.settings.outputs.kind }}
      role: ${{ steps.settings.outputs.role }}
      model: ${{ steps.settings.outputs.model }}
      effort: ${{ steps.settings.outputs.effort }}
      tool: ${{ steps.settings.outputs.tool }}
      tool_version: ${{ steps.settings.outputs.tool_version }}
      tools: ${{ steps.settings.outputs.tools }}
      max_turns: ${{ steps.settings.outputs.max_turns }}
      agent_timeout: ${{ steps.settings.outputs.agent_timeout }}
      job_timeout: ${{ steps.settings.outputs.job_timeout }}
      secrets: ${{ steps.settings.outputs.secrets }}
      iteration: ${{ steps.settings.outputs.iteration }}
      profile_digest: ${{ steps.settings.outputs.profile_digest }}
      staged: ${{ steps.pin.outputs.staged }}
      bundle: ${{ steps.pin.outputs.bundle }}
      baseline: ${{ steps.pin.outputs.baseline }}
    env:
      GH_TOKEN: ${{ github.token }}
      VARS_AUTOPILOT: ${{ vars.AUTOPILOT }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Get the engine
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: loop
          fetch-depth: 0
          persist-credentials: false
      # AUTOPILOT is the first check: a session created just before the switch-off stops too
      - name: Check AUTOPILOT is on
        id: autopilot
        working-directory: loop
        run: |
          if python3 .github/loop/loop.py check-autopilot; then echo go=true >> "$GITHUB_OUTPUT"; else echo go=false >> "$GITHUB_OUTPUT"; fi
      # a dead credential ends the job before the agent stands up
      - name: Check LLM provider credentials
        if: steps.autopilot.outputs.go == 'true'
        working-directory: loop
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 .github/loop/loop.py check-credentials
      - name: Load session settings
        id: settings
        if: steps.autopilot.outputs.go == 'true'
        working-directory: loop
        run: |
          pip install -q pyyaml
          python3 .github/loop/loop.py session-settings "${{ inputs.issue }}"
      - name: Get the task's working copy
        if: steps.autopilot.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.settings.outputs.start }}
          path: work
          fetch-depth: 0
          persist-credentials: false
      - name: Stage the session inputs
        if: steps.autopilot.outputs.go == 'true'
        working-directory: loop
        env:
          ISSUE: ${{ inputs.issue }}
          ROLE: ${{ steps.settings.outputs.role }}
          KIND: ${{ steps.settings.outputs.kind }}
          MODEL: ${{ steps.settings.outputs.model }}
          EFFORT: ${{ steps.settings.outputs.effort }}
          TOOLS: ${{ steps.settings.outputs.tools }}
          MAX_TURNS: ${{ steps.settings.outputs.max_turns }}
          AGENT_TIMEOUT: ${{ steps.settings.outputs.agent_timeout }}
          ITERATION: ${{ steps.settings.outputs.iteration }}
          PROFILE_DIGEST: ${{ steps.settings.outputs.profile_digest }}
          WORK: ${{ github.workspace }}/work
        run: python3 .github/loop/loop.py stage-inputs "$ISSUE" "$WORK" "$RUNNER_TEMP/trusted" "$RUNNER_TEMP/policy"
      # The executor baseline travels in an artifact of its own: the session never receives it. The policy bundle has its own
      # too: it holds the loop's facts for the policy scripts, which the session has no need of.
      - name: Pack the session inputs
        if: steps.autopilot.outputs.go == 'true'
        run: |
          mkdir "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/ship" "$RUNNER_TEMP/policy-bundle"
          mv "$RUNNER_TEMP/trusted/executor-baseline.json" "$RUNNER_TEMP/baseline/"
          tar -czf "$RUNNER_TEMP/ship/trusted.tar.gz" -C "$RUNNER_TEMP" trusted
          tar -czf "$RUNNER_TEMP/ship/work.tar.gz" -C "$GITHUB_WORKSPACE" work
          tar -czf "$RUNNER_TEMP/policy-bundle/bundle.tar.gz" -C "$RUNNER_TEMP/policy" .
      - name: Pin the artifacts by digest
        id: pin
        if: steps.autopilot.outputs.go == 'true'
        run: |
          pin() { python3 loop/.github/loop/artifact_pin.py digest "$RUNNER_TEMP/$1"; }
          echo "staged=$(pin ship)" >> "$GITHUB_OUTPUT"
          echo "bundle=$(pin policy-bundle)" >> "$GITHUB_OUTPUT"
          echo "baseline=$(pin baseline)" >> "$GITHUB_OUTPUT"
      - name: Upload the session inputs
        if: steps.autopilot.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: staged
          path: ${{ runner.temp }}/ship
      - name: Upload the policy bundle
        if: steps.autopilot.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: policy-bundle
          path: ${{ runner.temp }}/policy-bundle
      - name: Upload the executor baseline
        if: steps.autopilot.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: baseline
          path: ${{ runner.temp }}/baseline

  policy:
    name: Prepare the session inputs (policy scripts)
    needs: prep
    if: needs.prep.outputs.go == 'true' && needs.prep.result == 'success'
    runs-on: ubuntu-latest
    # No GitHub permission, no secret and no checkout (the repository may be private): it runs only the code of the bundle
    # "Prepare the session" made. The policy scripts are the loop's own and may print anything; the engine's checks decide.
    permissions: {}
    timeout-minutes: 30
    outputs:
      ok: ${{ steps.run.outputs.ok }}
      error: ${{ steps.run.outputs.error }}
      digest: ${{ steps.run.outputs.digest }}
    steps:
      - name: Download the session inputs
        uses: actions/download-artifact@v4
        with:
          name: staged
          path: ${{ runner.temp }}/ship
      - name: Download the policy bundle
        uses: actions/download-artifact@v4
        with:
          name: policy-bundle
          path: ${{ runner.temp }}/policy-bundle
      - name: Check the downloads against their digests
        env:
          STAGED: ${{ needs.prep.outputs.staged }}
          BUNDLE: ${{ needs.prep.outputs.bundle }}
        run: |
          pinned() {
            [ "$(cd "$1" && shopt -s dotglob && LC_ALL=C sha256sum -- * | sha256sum | cut -d' ' -f1)" = "$2" ] || { echo "::error::$1 is not the artifact the earlier job pinned"; exit 1; }
          }
          pinned "$RUNNER_TEMP/ship" "$STAGED"
          pinned "$RUNNER_TEMP/policy-bundle" "$BUNDLE"
      # the scripts read the tree the agent will get, without its git history
      - name: Unpack the session inputs
        run: |
          mkdir "$RUNNER_TEMP/policy"
          tar -xzf "$RUNNER_TEMP/policy-bundle/bundle.tar.gz" -C "$RUNNER_TEMP/policy"
          tar -xzf "$RUNNER_TEMP/ship/work.tar.gz" -C "$GITHUB_WORKSPACE" --exclude=work/.git
      - name: Run the policy scripts
        id: run
        run: python3 "$RUNNER_TEMP/policy/engine/loop.py" run-policy-scripts "$RUNNER_TEMP/policy" "$GITHUB_WORKSPACE/work" "$RUNNER_TEMP/policy-results"
      - name: Upload the policy script results
        if: steps.run.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: policy-results
          path: ${{ runner.temp }}/policy-results

  session:
    name: Run the session
    needs: [prep, policy]
    # bad policy script results: the session does not start, and "Take in results" fails the iteration
    if: needs.prep.outputs.go == 'true' && needs.prep.result == 'success' && needs.policy.result == 'success' && needs.policy.outputs.ok == 'true'
    runs-on: ubuntu-latest
    # No GitHub permission at all: the agent's code never runs next to the GitHub token (ADR-0006).
    permissions: {}
    # job_timeout = agent + gate + 30 min < 360: the 6 h limit kills a job as FAILED and the epilogue must fit
    timeout-minutes: ${{ fromJSON(needs.prep.outputs.job_timeout) }}
    env:
      ISSUE: ${{ inputs.issue }}
      KIND: ${{ needs.prep.outputs.kind }}
      MODEL: ${{ needs.prep.outputs.model }}
      EFFORT: ${{ needs.prep.outputs.effort }}
      TOOLS: ${{ needs.prep.outputs.tools }}
      MAX_TURNS: ${{ needs.prep.outputs.max_turns }}
      AGENT_TIMEOUT: ${{ needs.prep.outputs.agent_timeout }}
      WORK: ${{ github.workspace }}/work
    steps:
      - name: Download the session inputs
        uses: actions/download-artifact@v4
        with:
          name: staged
          path: ${{ runner.temp }}/ship
      - name: Download the policy script results
        uses: actions/download-artifact@v4
        with:
          name: policy-results
          path: ${{ runner.temp }}/policy-results
      - name: Check the downloads against their digests
        env:
          STAGED: ${{ needs.prep.outputs.staged }}
          RESULTS: ${{ needs.policy.outputs.digest }}
        run: |
          pinned() {
            [ "$(cd "$1" && shopt -s dotglob && LC_ALL=C sha256sum -- * | sha256sum | cut -d' ' -f1)" = "$2" ] || { echo "::error::$1 is not the artifact the earlier job pinned"; exit 1; }
          }
          pinned "$RUNNER_TEMP/ship" "$STAGED"
          pinned "$RUNNER_TEMP/policy-results" "$RESULTS"
      # an action and a shell step cannot be one step; tar stays because artifacts lose file modes
      - name: Unpack the session inputs
        run: |
          date +%s > "$RUNNER_TEMP/session-start"
          tar -xzf "$RUNNER_TEMP/ship/trusted.tar.gz" -C "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/ship/work.tar.gz" -C "$GITHUB_WORKSPACE"
          tar -xzf "$RUNNER_TEMP/policy-results/session.tar.gz" -C "$WORK/.session"
          [ ! -f "$RUNNER_TEMP/policy-results/prompt.md" ] || cp "$RUNNER_TEMP/policy-results/prompt.md" "$RUNNER_TEMP/trusted/prompt.md"
      # the name comes from the engine's output, not from this file; a script session needs no agent tool
      - name: Install ${{ needs.prep.outputs.tool }} ${{ needs.prep.outputs.tool_version }}
        if: needs.prep.outputs.kind == 'agent'
        env:
          TOOL_VERSION: ${{ needs.prep.outputs.tool_version }}
        run: npm install -g "@anthropic-ai/claude-code@$TOOL_VERSION"
      - name: Prepare the machine
        working-directory: work
        run: bash "$RUNNER_TEMP/trusted/prepare.sh"
      - name: ${{ needs.prep.outputs.kind == 'agent' && format('Run LLM session ({0}, {1})', needs.prep.outputs.model, needs.prep.outputs.effort) || format('Run script session ({0})', needs.prep.outputs.role) }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ needs.prep.outputs.kind == 'agent' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          # The pool: every secret the loop may ever hand to a session, one line each, gated on the name in the
          # owner's consent for this task (`session-settings` outputs `|NAME|…`). The owner owns this file;
          # `session-settings` refuses a consented name that has no line here (`secret-missing`).
          #   NAME: ${{ contains(needs.prep.outputs.secrets, '|NAME|') && secrets.NAME || '' }}
        run: bash "$RUNNER_TEMP/trusted/agent.sh"
      # Opt-in capture for the E2E test (repo variable E2E_CAPTURE=on, off by default): everything the session saw and
      # left, for later analysis. It holds the session's inputs, so a real loop leaves it off. Only `find` and `stat`
      # look at the agent's checkout: no git command, no hook of the agent's can run here. "Take in results" stores it.
      - name: Capture the session (E2E only)
        if: always() && vars.E2E_CAPTURE == 'on'
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p capture
          find "$WORK" -path "$WORK/.git" -prune -o -path "$WORK/.session" -prune -o -printf '%y %s %TY-%Tm-%TdT%TTZ %p\n' > capture/work-tree.txt || true
          find "$WORK" -path "$WORK/.git" -prune -o -path "$WORK/.session" -prune -o -type f -newer session-start -printf '%s %p\n' > capture/work-new-files.txt || true
          { uname -a; lsb_release -d || true; nproc; free -m; df -h "$WORK"; claude --version || true; } > capture/machine.txt 2>&1 || true
          env | grep -E '^(GITHUB_(RUN|JOB|WORKFLOW|EVENT|REF|SHA|ACTOR)|RUNNER_|ImageOS|ImageVersion)' | sort > capture/env.txt || true
          present=(); for f in trusted capture stream.ndjson agent-exit agent-start agent-end claude-stderr.txt claude-execution-output.json script-output.txt secret-missing; do [ -e "$f" ] && present+=("$f"); done
          tar -czf capture.tgz "${present[@]}" -C "$WORK" .session || true
      - name: Upload the raw stream
        uses: actions/upload-artifact@v4
        # The stream is a diagnostic copy. A full artifact quota must not turn a good session into `failure`;
        # the record then simply has no `stream`.
        continue-on-error: true
        if: always()
        with:
          name: stream-${{ needs.prep.outputs.iteration }}-${{ inputs.issue }}
          path: ${{ runner.temp }}/stream.ndjson
          if-no-files-found: ignore
      - name: Pack the session results
        if: always()
        run: python3 "$RUNNER_TEMP/trusted/session_artifact.py" pack "$WORK" "$RUNNER_TEMP" "$RUNNER_TEMP/results"
      - name: Upload the results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore

  epilogue:
    name: Take in results
    needs: [prep, policy, session]
    if: always() && needs.prep.outputs.go == 'true' && needs.prep.result == 'success'
    runs-on: ubuntu-latest
    env:
      ISSUE: ${{ inputs.issue }}
      ROLE: ${{ needs.prep.outputs.role }}
      KIND: ${{ needs.prep.outputs.kind }}
      MODEL: ${{ needs.prep.outputs.model }}
      EFFORT: ${{ needs.prep.outputs.effort }}
      ITERATION: ${{ needs.prep.outputs.iteration }}
      PROFILE_DIGEST: ${{ needs.prep.outputs.profile_digest }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      VARS_AUTOPILOT: ${{ vars.AUTOPILOT }}
    steps:
      - name: Get the engine
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: loop
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # a session that died leaves no results: the last job still closes it
      - name: Download the results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: results
          path: ${{ runner.temp }}/results
      - name: Download the executor baseline
        uses: actions/download-artifact@v4
        with:
          name: baseline
          path: ${{ runner.temp }}/baseline
      # bad policy script results leave none (and the session did not start): "Take in results" refuses it
      - name: Download the policy script results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: policy-results
          path: ${{ runner.temp }}/policy-results
      - name: Check, gate and merge the results
        working-directory: loop
        env:
          GH_TOKEN: ${{ github.token }}
          # the engine's own check confirms a usage limit a session reports
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          POLICY_OK: ${{ needs.policy.outputs.ok }}
          POLICY_ERROR: ${{ needs.policy.outputs.error }}
          POLICY_DIGEST: ${{ needs.policy.outputs.digest }}
        run: |
          pip install -q pyyaml
          python3 .github/loop/loop.py take-results "$ISSUE" "$RUNNER_TEMP/results" "$RUNNER_TEMP/baseline" "${{ needs.prep.outputs.baseline }}" "$RUNNER_TEMP/policy-results"
      # a release asset, not an artifact: the artifact quota of an account can be used up, and then nothing is stored
      - name: Store the capture (E2E only)
        if: always() && vars.E2E_CAPTURE == 'on'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/results/capture.tgz" ] || exit 0
          name="capture-${{ needs.prep.outputs.iteration }}-$ISSUE"
          cp "$RUNNER_TEMP/results/capture.tgz" "$RUNNER_TEMP/$name.tgz"
          gh release create e2e-capture --title e2e-capture --notes "Session captures of the E2E test" --target "$DEFAULT_BRANCH" -R "$GITHUB_REPOSITORY" || true
          gh release upload e2e-capture "$RUNNER_TEMP/$name.tgz" --clobber -R "$GITHUB_REPOSITORY"
