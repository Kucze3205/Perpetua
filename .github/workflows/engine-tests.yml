name: Engine tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          # python3-yaml: the system Python reads engine/engine.yml
          sudo apt-get install -y python3-yaml
          git config --global gc.auto 0
          git config --global maintenance.auto false
      - name: Verify system Python 3.14
        if: matrix.os == 'ubuntu-26.04'
        run: /usr/bin/python3 -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"
      - name: Run engine tests
        run: /usr/bin/python3 -m unittest discover -s engine/.github/loop/tests -v
      - name: Run update tests
        run: python3 -m unittest discover -s skills/update -p test_engine_update.py -v
