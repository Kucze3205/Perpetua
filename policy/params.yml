shaper: orchestrator
criterion: shortest wall-clock time to the goal
policymaker_session:
  model: gpt-6-luna
  effort: low
  max_turns: 30
  timeout_minutes: 10
models:
  default: gpt-6-luna
  opus: gpt-6-luna
efforts:
- low
- medium
- high
ceilings:
  job_minutes: 240
  iteration_minutes: 60
  max_turns: 150
