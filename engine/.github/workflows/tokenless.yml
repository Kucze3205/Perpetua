# Runs one command on data, on a machine that holds no GitHub token (ADR-0006). The engine pushes a bundle to the ref
# `refs/tokenless/<key>` (outside the branches, so it is in no branch list and no history) and dispatches this
# workflow; the bundle's `run.sh` runs in `tokenless-job.yml` (`permissions: {}`) and its outputs come back as the
# artifact `result-<key>`. The first user is the change gate. The run name carries `key`: the engine finds its own
# run by it.
name: Tokenless run
run-name: "Tokenless: ${{ inputs.purpose || 'command' }} [${{ inputs.key }}]"

on:
  workflow_dispatch:
    inputs:
      key:
        description: Key of the bundle ref refs/tokenless/<key>
        required: true
      timeout_minutes:
        description: Time limit of the command
        required: true
      purpose:
        description: What the command is for (only for the run name)
        required: false

permissions:
  contents: read

jobs:
  stage:
    name: Fetch the bundle
    if: vars.AUTOPILOT == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the bundle
        uses: actions/checkout@v7
        with:
          ref: refs/tokenless/${{ inputs.key }}
          path: bundle
          persist-credentials: false
      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ inputs.key }}
          path: bundle/bundle.tar.gz

  run:
    name: Run the command
    needs: stage
    permissions: {}
    uses: ./.github/workflows/tokenless-job.yml
    with:
      key: ${{ inputs.key }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
