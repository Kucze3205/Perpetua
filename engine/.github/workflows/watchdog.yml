# The watchdog: a clock outside the chain. A plain script, no agent: a watchdog session could fall to the very
# disease it cures. It kicks before it calls; it announces an outage with a red run (a cron run e-mails the author
# of the workflow file, the only free push channel). It also starts the first iteration after arming and sweeps
# owner requests the owner has closed. An iteration it finds due to start (the first, one the cadence held back, one whose
# start was lost) starts in the jobs of "Iteration start" (`iteration-start.yml`), as at the end of a session.
name: Watchdog
run-name: "Watchdog check"

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: watchdog
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  watch:
    name: Check the loop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      start: ${{ steps.watch.outputs.start }}
      count: ${{ steps.watch.outputs.count }}
      minutes: ${{ steps.watch.outputs.minutes }}
      digest: ${{ steps.watch.outputs.digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      VARS_AUTOPILOT: ${{ vars.AUTOPILOT }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Get the engine
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Check the loop
        id: watch
        env:
          START_PLAN: ${{ runner.temp }}/start-facts
        run: |
          pip install -q pyyaml
          python3 .github/loop/loop.py watch
      - name: Upload the facts for the iteration start
        if: always() && steps.watch.outputs.start == 'true' && steps.watch.outputs.count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: start-facts
          path: ${{ runner.temp }}/start-facts

  start:
    name: Iteration start
    needs: watch
    if: always() && needs.watch.outputs.start == 'true'
    uses: ./.github/workflows/iteration-start.yml
    with:
      count: ${{ needs.watch.outputs.count }}
      minutes: ${{ needs.watch.outputs.minutes }}
      digest: ${{ needs.watch.outputs.digest }}
